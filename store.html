<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Xoleric — APK Store</title>
  <link rel="canonical" href="https://xolerc.github.io/mydrime/store.html">
  <meta name="description" content="Xoleric shaxsiy APK Store — ilovalarni QR orqali yuklab oling.">
  <meta name="color-scheme" content="dark">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', system-ui, sans-serif;
      /* portfolio (index.html) bilan bir xil fon */
      background:
        radial-gradient(ellipse 60% 32% at 50% 0%, rgba(142, 160, 184, 0.32) 0%, rgba(17, 25, 33, 0.30) 52%, transparent 70%),
        radial-gradient(ellipse at 50% 0%, #161c28 0%, #0b0f18 75%);
      background-color: #0b101a;
      color: #e8ecf4; min-height: 100vh; padding: clamp(16px, 4vw, 48px);
    }
    /* portfolio'dagi kuchli #111921 shu'la qatlami */
    .gold-glow {
      position: fixed; top: -22%; left: 50%;
      width: min(1100px, 130vw); height: min(620px, 72vh);
      transform: translateX(-50%); z-index: -1; pointer-events: none;
      background: radial-gradient(ellipse at 50% 38%,
        rgba(142, 160, 184, 0.34) 0%,
        rgba(17, 25, 33, 0.36) 48%,
        transparent 70%);
      animation: goldBreathe 12s ease-in-out infinite alternate;
      will-change: opacity;
    }
    @keyframes goldBreathe { 0% { opacity: 0.65; } 100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { .gold-glow { animation: none; opacity: 0.85; } }
    /* portfolio'dagi vignetka */
    .vignette {
      position: fixed; inset: 0; z-index: 26; pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 40%, rgba(4, 6, 10, 0.55) 100%);
    }
    .wrap { max-width: 860px; margin: 0 auto; }
    .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 26px; }
    h1 { font-family: 'Space Grotesk', sans-serif; font-size: clamp(24px, 5vw, 34px); }
    h1 span { color: #ffffff; }
    .back { color: #ffffff; text-decoration: none; font-size: 14px; font-weight: 600; }
    .back:hover { text-decoration: underline; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 18px; }
    .app { text-align: center; border-radius: 22px; padding: 22px 14px 18px;
      background: linear-gradient(180deg, rgba(17,25,33,.65), rgba(255,255,255,.03)); border: 1px solid rgba(255,255,255,0.2);
      box-shadow: 0 0 34px rgba(17,25,33,.45), 0 0 50px rgba(142,160,184,.12); }
    .app img { width: 132px; height: 132px; border-radius: 14px; background: #fff; padding: 7px;
      cursor: zoom-in; border: 1px solid rgba(255,255,255,0.2); transition: transform .25s; }
    .app img:hover { transform: scale(1.05); }
    .app b { display: block; margin-top: 12px; font-size: 15px; }
    .modal { position: fixed; inset: 0; z-index: 50; display: flex; align-items: center; justify-content: center;
      visibility: hidden; opacity: 0; transition: opacity .3s, visibility .3s; }
    .modal.open { visibility: visible; opacity: 1; }
    .bg { position: absolute; inset: 0; background: rgba(4,6,10,.6);
      backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
    .box { position: relative; text-align: center; border-radius: 26px; padding: 28px 32px;
      background: #111921; border: 1px solid rgba(255,255,255,0.28);
      box-shadow: 0 24px 80px rgba(0,0,0,.6), 0 0 80px rgba(17,25,33,.55), 0 0 90px rgba(142,160,184,.18);
      transform: scale(.9); transition: transform .3s; }
    .modal.open .box { transform: scale(1); }
    .box img { width: min(64vw, 250px); height: min(64vw, 250px); border-radius: 18px; background: #fff; padding: 10px; }
    .box b { display: block; margin-top: 12px; font-size: 17px; }
    .dl { display: inline-block; margin-top: 14px; padding: 12px 26px; border-radius: 12px;
      background: #111921; color: #ffffff; font-weight: 800; text-decoration: none; border: 1px solid rgba(255,255,255,0.35); box-shadow: 0 10px 28px rgba(0,0,0,.5), 0 0 26px rgba(142,160,184,.35); }
    .x { position: absolute; top: 8px; right: 12px; border: 0; background: none;
      color: #8a93a3; font-size: 18px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="gold-glow" aria-hidden="true"></div>
  <div class="vignette" aria-hidden="true"></div>
  <div class="wrap">
    <div class="top">
      <h1>APK <span>Store</span></h1>
      <a class="back" href="index.html">← ortga</a>
    </div>
    <div class="grid" id="grid"></div>
  </div>

  <div class="modal" id="modal" aria-hidden="true" role="dialog" aria-label="QR kod">
    <div class="bg" data-close></div>
    <div class="box">
      <button class="x" data-close aria-label="Yopish">✕</button>
      <img id="big" src="" alt="QR kod">
      <b id="nm"></b>
      <br><a class="dl" id="dl" href="#" download>⬇ Yuklab olish</a>
    </div>
  </div>

  <script>
    /* Yangi APK: APPS ga 1 qator qo'shing */
    var APPS = [
      { id: 'savodhon-flutter', name: 'Savodhon Super', qr: 'images/savodhon-flutter-qr.png',
        apk: 'https://github.com/xolerc/Savodhon/releases/download/v4.1/Savodhon-flutter.apk' }
    ];
    var grid = document.getElementById('grid');
    grid.innerHTML = APPS.map(function (a) {
      return '<div class="app"><img src="' + a.qr + '" alt="' + a.name + ' QR" data-id="' + a.id + '"><b>' + a.name + '</b></div>';
    }).join('');
    var modal = document.getElementById('modal');
    function find(id) { for (var i = 0; i < APPS.length; i++) if (APPS[i].id === id) return APPS[i]; return null; }
    function open(id) {
      var a = find(id); if (!a) return;
      document.getElementById('big').src = a.qr;
      document.getElementById('nm').textContent = a.name;
      document.getElementById('dl').href = a.apk;
      modal.classList.add('open'); modal.setAttribute('aria-hidden', 'false');
    }
    function close() { modal.classList.remove('open'); modal.setAttribute('aria-hidden', 'true'); }
    document.addEventListener('click', function (e) {
      var img = e.target.closest ? e.target.closest('img[data-id]') : null;
      if (img) { open(img.getAttribute('data-id')); return; }
      if (e.target.closest && e.target.closest('[data-close]')) close();
    });
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') close(); });
  </script>
</body>
</html>
