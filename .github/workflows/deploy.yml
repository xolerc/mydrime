name: Deploy Pages (ixtiyoriy)

# Sayt hozirda Pages -> "Deploy from branch: main" orqali nashr etiladi.
# Actions orqali deploy qilish uchun:
#   1) Settings > Pages > Build and deployment > Source = "GitHub Actions"
#   2) Settings > Actions > Variables > PAGES_ACTIONS = true
# Shundan keyin bu workflow main ga pushda avtomatik ishlaydi.
# O'chirib qo'yish uchun PAGES_ACTIONS = false qiling (yoki o'chiring).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || vars.PAGES_ACTIONS == 'true'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Reponi olish
        uses: actions/checkout@v4
      - name: Pages sozlamalari
        uses: actions/configure-pages@v5
      - name: Statik fayllarni yig'ish
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - name: Nashr qilish
        id: deployment
        uses: actions/deploy-pages@v4
